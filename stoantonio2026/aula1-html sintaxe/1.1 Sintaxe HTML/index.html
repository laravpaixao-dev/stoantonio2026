<!DOCTYPE html> <!-- Avisa ao navegador que o site usa o HTML5 (versao atual) -->

<html lang="en"><!-- Inicia o site e define o idioma como Portugues do Brasil -->
<head><!-- Abre a area de configuracoes internas. Tudo o que vai aqui dentro nao aparece na tela do site -->
    <meta charset="UTF-8"><!-- Configura o site para aceitar acentos (a, e, o) e o padrao de escrita global -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Faz a pagina se ajustar automaticamente ao tamanho da tela de celulares e computadores -->
    <title>Document</title><!-- Define o nome 'Document' que vai aparecer na aba la no topo do seu navegador -->
</head><!-- Fecha a area de configuracoes internas do site -->
<body><!-- Abre o corpo da pagina. e aqui no meio que voce vai digitar tudo o que o usuario consegue ver (textos, imagens, botoes) -->
   
</body><!-- Fecha a area de conteudo visivel do site (no momento esta vazia) -->
</html> <!-- Encerra definitivamente o codigo de toda a pagina HTML. Nada deve ser escrito depois disso -->
